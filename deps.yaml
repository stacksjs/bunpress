dependencies:
  # Pinned, not caret-ranged. Bun 1.4 writes `lockfileVersion: 2`, which 1.3.x
  # cannot parse, so a contributor picking up 1.4 automatically would rewrite
  # bun.lock and break every CI job at `bun install --frozen-lockfile`. CI and
  # `packageManager` name this same exact version; moving off 1.3.14 is a
  # deliberate three-file change, not something a resolver decides.
  bun.sh: 1.3.14
