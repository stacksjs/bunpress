name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@9f797da1ed073df7839cb6a9a7db6181ba33f0b7
        with:
          version: 0.11.12
          packages: bun.sh@1.3.14
          install: 'false'

      - name: Prepare exact owned dependencies
        run: bun run deps:owned:ci

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@9f797da1ed073df7839cb6a9a7db6181ba33f0b7
        with:
          version: 0.11.12
          packages: bun.sh@1.3.14
          install: 'false'

      - name: Prepare exact owned dependencies
        run: bun run deps:owned:ci

      - name: Build
        run: bun run build

      - name: Typecheck
        run: cd packages/bunpress && bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@9f797da1ed073df7839cb6a9a7db6181ba33f0b7
        with:
          version: 0.11.12
          packages: bun.sh@1.3.14
          install: 'false'

      - name: Prepare exact owned dependencies
        run: bun run deps:owned:ci

      - name: Build
        run: bun run build

      - name: Unit Test
        run: bun test

  publish-commit:
    name: publish-commit
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@9f797da1ed073df7839cb6a9a7db6181ba33f0b7
        with:
          version: 0.11.12
          packages: bun.sh@1.3.14
          install: 'false'

      - name: Prepare exact owned dependencies
        run: bun run deps:owned:ci

      - name: Build
        run: bun run build

      - name: Publish Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: pantry publish:commit './packages/*'
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
