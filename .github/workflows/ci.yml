name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@9f797da1ed073df7839cb6a9a7db6181ba33f0b7
        with:
          version: 0.11.12
          packages: bun.sh@1.3.14
          install: 'false'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@9f797da1ed073df7839cb6a9a7db6181ba33f0b7
        with:
          version: 0.11.12
          packages: bun.sh@1.3.14
          install: 'false'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: cd packages/bunpress && bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@9f797da1ed073df7839cb6a9a7db6181ba33f0b7
        with:
          version: 0.11.12
          packages: bun.sh@1.3.14
          install: 'false'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Unit Test
        run: bun test

  publish-commit:
    name: publish-commit
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@9f797da1ed073df7839cb6a9a7db6181ba33f0b7
        with:
          version: 0.11.12
          packages: bun.sh@1.3.14
          install: 'false'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: pantry publish:commit './packages/*'
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}

  deploy-docs:
    name: deploy bunpress.org
    needs: [lint, typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: bunpress-org-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@9f797da1ed073df7839cb6a9a7db6181ba33f0b7
        with:
          version: 0.11.12
          packages: bun.sh@1.3.14
          install: 'false'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::923076644019:role/github-actions-bunpress-deploy

      - name: Load encrypted production environment
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .env.keys' EXIT

          aws ssm get-parameter \
            --name /bunpress/production/env-key \
            --with-decryption \
            --query Parameter.Value \
            --output text > .env.keys
          chmod 600 .env.keys
          bun run env:production

      - name: Build documentation
        run: bun run build:docs

      - name: Publish site and invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail

          aws s3 sync "dist/.bunpress" "s3://${AWS_S3_BUCKET}" \
            --delete \
            --cache-control 'max-age=3600, public'
          aws cloudfront create-invalidation \
            --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*'
