name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@91ded221f8de3badd9fc5ab1d4072d561c1eb1d4 # v0.11.126
        with:
          version: 0.11.71
          packages: bun.sh@1.3.14
          install: 'false'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish
        run: pantry publish --npm --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.11
        with:
          files: |
            bin/bunpress-linux-x64
            bin/bunpress-linux-arm64
            bin/bunpress-windows-x64.exe
            bin/bunpress-darwin-x64
            bin/bunpress-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
